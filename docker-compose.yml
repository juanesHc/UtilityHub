services:
  postgres:
    image: postgres:16
    container_name: utilityhub-postgres
    environment:
      POSTGRES_DB: utilityhub
      POSTGRES_USER: utilityhub
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - utilityhub-datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utilityhub -d utilityhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  utilityhub-datos-postgres:
